name: Generate Test Report

on:
  workflow_run:
    workflows: ["Backend Tests", "Frontend Tests"]
    types:
      - completed
  push:
    branches:
      - main

jobs:
  generate-report:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install backend dependencies
        working-directory: ./server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run backend tests
        working-directory: ./server
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'test-key' }}
        run: |
          pytest --cov=. --cov-report=json --json-report --json-report-file=test-results.json || true
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci
      
      - name: Install Playwright
        working-directory: ./client
        run: npx playwright install --with-deps chromium
      
      - name: Run frontend tests
        working-directory: ./client
        run: npm run test:e2e || true
      
      - name: Generate test report
        run: |
          python scripts/generate_test_report.py
      
      - name: Commit test report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add client/public/test-report.json
          git diff --staged --quiet || git commit -m "Update test report [skip ci]"
          git push || echo "No changes to push"
