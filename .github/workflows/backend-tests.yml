name: Backend Tests

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'server/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: ./server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run pylint
        working-directory: ./server
        run: |
          pylint **/*.py --rcfile=.pylintrc || true
      
      - name: Run pytest with coverage
        working-directory: ./server
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'test-key' }}
        run: |
          pytest --cov=. --cov-report=json --cov-report=term --cov-fail-under=80
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage.json
      
      - name: Check coverage threshold
        working-directory: ./server
        run: |
          python -c "import json; data = json.load(open('coverage.json')); percent = data['totals']['percent_covered']; exit(0 if percent >= 80 else 1)"
